<!-- 图名：服务模式阶梯 SM1–SM4——台阶面为级别名、每级挂落地前提（第 30 章 30.2） -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 510" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <rect width="800" height="510" fill="#ffffff"/>

  <text x="40" y="42" fill="#1a1a1a" font-size="14" font-weight="600">服务模式阶梯：SM1 → SM4</text>

  <!-- 四级台阶 -->
  <g stroke="#c9c9c9" stroke-width="1.5" fill="#ffffff">
    <rect x="40" y="370" width="180" height="90"/>
    <rect x="220" y="280" width="180" height="180"/>
    <rect x="400" y="190" width="180" height="270"/>
  </g>
  <rect x="580" y="100" width="180" height="360" fill="#c8442c" fill-opacity="0.14" stroke="#c8442c" stroke-width="1.5"/>

  <!-- 台阶面：级别名 -->
  <g fill="#1a1a1a" font-size="16" font-weight="600" text-anchor="middle">
    <text x="130" y="400">SM1 被动响应</text>
    <text x="310" y="310">SM2 主动预防</text>
    <text x="490" y="220">SM3 预测性服务</text>
    <text x="670" y="130">SM4 有界自愈</text>
  </g>

  <!-- 立面：落地前提（必备基础） -->
  <g fill="#8a8a8a" font-size="10" text-anchor="middle">
    <text x="130" y="422">落地前提</text>
    <text x="310" y="332">落地前提</text>
    <text x="490" y="242">落地前提</text>
    <text x="670" y="152">落地前提</text>
  </g>
  <g fill="#5a5a5a" font-size="11" text-anchor="middle">
    <text x="130" y="442">值班、工单、升级路径</text>
    <text x="310" y="352">监控覆盖、风险登记册</text>
    <text x="310" y="368">健康分</text>
    <text x="490" y="262">历史数据、动态基线</text>
    <text x="490" y="278">业务日历</text>
    <text x="670" y="172">护栏、回滚、演练、审计</text>
  </g>

  <!-- 跃迁前置条件 -->
  <g fill="#8a8a8a" font-size="10" text-anchor="middle">
    <text x="220" y="256">监控覆盖完整，风险登记册运行</text>
    <text x="220" y="272">健康度口径确定</text>
    <text x="400" y="166">关键指标有可信历史</text>
    <text x="400" y="182">基线能解释业务日历</text>
    <text x="580" y="76">预测结果可验证</text>
    <text x="580" y="92">处置动作模式化且可逆</text>
  </g>

  <line x1="30" y1="460" x2="770" y2="460" stroke="#c9c9c9" stroke-width="1.5"/>
  <text x="400" y="488" fill="#8a8a8a" font-size="12" text-anchor="middle">按系统粒度判定，逐级晋级不可跳级；每一级都有前置门票，平台采购不算晋级证据。</text>
</svg>
