<!DOCTYPE html>
<html lang="zh-CN" data-book="{{BOOK_KEY}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} · {{BOOK_EN}}</title>
<meta name="description" content="{{BOOK_ZH}}——{{TITLE}}。铁角指北三书在线阅读。">
<script>
(function () {
  try {
    var f = localStorage.getItem('it-fs');
    if (f) document.documentElement.style.setProperty('--fs', f);
    var t = localStorage.getItem('it-theme');
    if (t) document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="{{ROOT}}assets/reader.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230f62fe'/%3E%3Cpath d='M8 9h16v3.4h-6.3V25h-3.4V12.4H8z' fill='%23fff'/%3E%3C/svg%3E">
</head>
<body data-file="{{FILE}}">
<div id="progress"></div>

<header id="topbar">
  <button class="tbtn" id="btn-toc" aria-label="目录">
    <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
  </button>
  <a class="brand" href="{{BRAND_HREF}}">
    <span class="seal">{{BOOK_SEAL}}</span>
    <b>{{BOOK_EN}}</b><small>{{BOOK_ZH}}</small>
  </a>
  <div id="crumb">{{CRUMB}}</div>
  <div class="tb-btns">
    <details class="bookswitch" id="bookswitch">
      <summary class="tbtn" aria-label="切换书籍">
        <svg viewBox="0 0 24 24"><path d="M4 5.5h7v13H4zM13 5.5h7v13h-7z"/></svg>
        <span class="hide-s">三书</span>
      </summary>
      <div class="switch-panel">
        <div class="switch-head">铁角指北 · 三书</div>
        {{SWITCH}}
        <a class="switch-all" href="{{ROOT}}index.html">丛书总览 →</a>
      </div>
    </details>
    <button class="tbtn" id="btn-search" aria-label="搜索三书">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span class="hide-s">搜索</span><kbd>/</kbd>
    </button>
    <button class="tbtn" id="btn-fs-down" aria-label="缩小字号">A−</button>
    <button class="tbtn" id="btn-fs-up" aria-label="放大字号">A+</button>
    <button class="tbtn" id="btn-theme" aria-label="切换深浅主题" title="切换深浅主题">
      <svg class="ic-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
      <svg class="ic-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M19 5l-1.5 1.5M6.5 17.5 5 19"/></svg>
    </button>
  </div>
</header>

<div id="backdrop"></div>

<div id="shell">
  <nav id="sidebar" aria-label="本书目录">
    {{SIDEBAR}}
  </nav>

  <div id="main">
    <div id="doc">
      <article>
        <div class="chead">
          {{BIGNUM}}
          <h1>{{H1}}</h1>
          <div class="meta">{{GENRE}}<span class="part">{{KICKER}}</span><span>{{META}}</span></div>
        </div>
{{CONTENT}}
        <nav class="pager" aria-label="章节导航">
          <a class="prev {{PREV_CLS}}" href="{{PREV_HREF}}"><span class="dir">← 上一篇</span><span class="pt">{{PREV_TITLE}}</span></a>
          <a class="next {{NEXT_CLS}}" href="{{NEXT_HREF}}"><span class="dir">下一篇 →</span><span class="pt">{{NEXT_TITLE}}</span></a>
        </nav>
      </article>
      <nav id="outline" aria-label="本章小节" hidden>
        <div class="outline-head">本章小节</div>
      </nav>
    </div>
    <footer class="pagefoot">
      <span>{{BOOK_EN}} · {{BOOK_STATUS}} · CC BY-NC-SA 4.0</span>
      <span><a href="{{ROOT}}index.html">丛书总览</a></span>
    </footer>
  </div>
</div>

<div id="search-overlay">
  <div id="search-panel">
    <input id="search-big" type="search" placeholder="搜索三书章节、条目与正文…" autocomplete="off" aria-label="搜索三书">
    <div id="search-results"></div>
    <div id="search-hint"><span><kbd>↑</kbd><kbd>↓</kbd> 选择 · <kbd>Enter</kbd> 打开 · <kbd>Esc</kbd> 关闭</span><span id="search-count"></span></div>
  </div>
</div>

<script>window.__ROOT__ = "{{ROOT}}";</script>
<script src="{{ROOT}}assets/reader.js"></script>
</body>
</html>
