<!-- 图名：关键人三链——决策链、影响链、防线的多点网络结构（第 9 章 9.3 节） -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <rect width="800" height="500" fill="#ffffff"/>

  <!-- 链名顶部标签 -->
  <g font-size="17" font-weight="600" fill="#1a1a1a" text-anchor="middle">
    <rect x="80" y="24" width="140" height="36" rx="6" fill="#e3e3e3"/>
    <text x="150" y="49">决策链</text>
    <rect x="330" y="24" width="140" height="36" rx="6" fill="#e3e3e3"/>
    <text x="400" y="49">影响链</text>
    <rect x="580" y="24" width="140" height="36" rx="6" fill="#e3e3e3"/>
    <text x="650" y="49">防线</text>
  </g>

  <!-- 决策链节点：CIO → CTO → 科技负责人 -->
  <g fill="#ffffff" stroke="#c9c9c9" stroke-width="1.5">
    <circle cx="150" cy="130" r="44"/>
    <circle cx="150" cy="250" r="44"/>
    <circle cx="150" cy="370" r="44"/>
  </g>
  <g fill="#1a1a1a" font-size="14" font-weight="600" text-anchor="middle">
    <text x="150" y="135">CIO</text>
    <text x="150" y="255">CTO</text>
    <text x="150" y="375">科技负责人</text>
  </g>

  <!-- 影响链节点：架构师 → 运维骨干 → 合规骨干 -->
  <g fill="#ffffff" stroke="#c9c9c9" stroke-width="1.5">
    <circle cx="400" cy="130" r="44"/>
    <circle cx="400" cy="250" r="44"/>
    <circle cx="400" cy="370" r="44"/>
  </g>
  <g fill="#1a1a1a" font-size="14" font-weight="600" text-anchor="middle">
    <text x="400" y="135">架构师</text>
    <text x="400" y="255">运维骨干</text>
    <text x="400" y="375">合规骨干</text>
  </g>

  <!-- 防线节点：竞争支持者 → 利益受影响者 -->
  <g fill="#ffffff" stroke="#c9c9c9" stroke-width="1.5">
    <circle cx="650" cy="130" r="44"/>
    <circle cx="650" cy="250" r="44"/>
  </g>
  <g fill="#1a1a1a" font-size="14" font-weight="600" text-anchor="middle">
    <text x="650" y="135">竞争支持者</text>
    <text x="650" y="255">利益受影响者</text>
  </g>

  <!-- 链内箭头 -->
  <g stroke="#5a5a5a" stroke-width="1.5" fill="#5a5a5a">
    <line x1="150" y1="176" x2="150" y2="198"/>
    <polygon points="150,204 145,194 155,194"/>
    <line x1="150" y1="296" x2="150" y2="318"/>
    <polygon points="150,324 145,314 155,314"/>
    <line x1="400" y1="176" x2="400" y2="198"/>
    <polygon points="400,204 395,194 405,194"/>
    <line x1="400" y1="296" x2="400" y2="318"/>
    <polygon points="400,324 395,314 405,314"/>
    <line x1="650" y1="176" x2="650" y2="198"/>
    <polygon points="650,204 645,194 655,194"/>
  </g>

  <!-- 防线处理提示框 -->
  <rect x="555" y="330" width="190" height="72" rx="6" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.5"/>
  <g fill="#5a5a5a" font-size="12" text-anchor="middle">
    <text x="650" y="356">三个不：不绕过、不压制、不激化</text>
    <text x="650" y="378">用事实、交付物和稳定态度</text>
    <text x="650" y="396">争取信任</text>
  </g>

  <!-- 每链功能与经营重点 -->
  <g font-size="13" text-anchor="middle">
    <text x="150" y="444" fill="#1a1a1a" font-weight="600">决策与资源授权</text>
    <text x="150" y="466" fill="#8a8a8a" font-size="12">经营重点：价值、风险与选择</text>
    <text x="400" y="444" fill="#1a1a1a" font-weight="600">评估、影响与执行</text>
    <text x="400" y="466" fill="#8a8a8a" font-size="12">经营重点：专业可信与协同</text>
    <text x="650" y="444" fill="#1a1a1a" font-weight="600">风险提示与阻力来源</text>
    <text x="650" y="466" fill="#8a8a8a" font-size="12">经营重点：理解动机，保持专业</text>
  </g>
  <text x="400" y="492" fill="#8a8a8a" font-size="12" text-anchor="middle">三条链不是敌我划分：防线人物不是敌人，反对可能来自历史问题、职责要求或利益差异。</text>
</svg>
