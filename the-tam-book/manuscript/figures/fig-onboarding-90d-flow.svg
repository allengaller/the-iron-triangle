<!-- 图名：Onboarding 90 天四段节奏——0/30/60/90 天时间轴、S1–S4 闸门与三问验收 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <rect width="800" height="400" fill="#ffffff"/>

  <!-- 图题 -->
  <g text-anchor="middle">
    <text x="400" y="44" fill="#1a1a1a" font-size="17" font-weight="600">Onboarding 90 天：30/60/90 里程碑与 S1–S4 闸门</text>
    <text x="400" y="68" fill="#5a5a5a" font-size="13">出口闸门不过，不进入下一段；阶段判定按状态，不按日历</text>
  </g>

  <!-- 时间轴 -->
  <line x1="60" y1="100" x2="766" y2="100" stroke="#c9c9c9" stroke-width="2"/>
  <polygon points="772,100 762,95 762,105" fill="#c9c9c9"/>
  <g stroke="#c9c9c9" stroke-width="1.5">
    <line x1="60" y1="100" x2="60" y2="110"/>
    <line x1="260" y1="100" x2="260" y2="110"/>
    <line x1="460" y1="100" x2="460" y2="110"/>
    <line x1="660" y1="100" x2="660" y2="110"/>
  </g>
  <g fill="#8a8a8a" font-size="12" text-anchor="middle">
    <text x="60" y="90">0 天</text>
    <text x="260" y="90">30 天</text>
    <text x="460" y="90">60 天</text>
    <text x="660" y="90">90 天</text>
  </g>

  <!-- 四段色带 -->
  <g stroke-width="1.5">
    <rect x="60" y="110" width="200" height="64" rx="6" fill="#e3e3e3" stroke="#c9c9c9"/>
    <rect x="260" y="110" width="200" height="64" rx="6" fill="#e3e3e3" stroke="#c9c9c9"/>
    <rect x="460" y="110" width="200" height="64" rx="6" fill="#c9c9c9" stroke="#c9c9c9"/>
    <rect x="660" y="110" width="100" height="64" rx="6" fill="#c8442c" fill-opacity="0.14" stroke="#c8442c"/>
  </g>
  <g text-anchor="middle">
    <g fill="#1a1a1a" font-size="14" font-weight="600">
      <text x="160" y="136">家底摸清</text>
      <text x="360" y="136">机制转起来</text>
      <text x="560" y="136">首个价值点落地</text>
      <text x="710" y="136">验收移交</text>
    </g>
    <g fill="#1a1a1a" font-size="12">
      <text x="160" y="156">材料接管与权限确认</text>
      <text x="360" y="156">共同签署服务计划</text>
      <text x="560" y="156">第 61–90 天落地价值</text>
      <text x="710" y="156">三问验收</text>
    </g>
    <g fill="#5a5a5a" font-size="12">
      <text x="160" y="171">拓扑、关键人与风险册建档</text>
      <text x="360" y="171">例会启动并运行两轮</text>
      <text x="560" y="171">管理层可感知</text>
      <text x="710" y="171">S4 移交</text>
    </g>
  </g>

  <!-- 闸门节点 -->
  <g fill="#c8442c" fill-opacity="0.14" stroke="#c8442c" stroke-width="1.5">
    <polygon points="260,166 269,174 260,182 251,174"/>
    <polygon points="460,166 469,174 460,182 451,174"/>
    <polygon points="660,166 669,174 660,182 651,174"/>
  </g>
  <g text-anchor="middle">
    <g fill="#1a1a1a" font-size="14" font-weight="600">
      <text x="260" y="206">第 30 天</text>
      <text x="460" y="206">第 60 天</text>
      <text x="660" y="206">第 90 天</text>
    </g>
    <g fill="#5a5a5a" font-size="12">
      <text x="260" y="226">S1 材料签收 · S2 现场诊断</text>
      <text x="460" y="226">S3 计划落地</text>
      <text x="660" y="226">S4 验收与移交</text>
    </g>
  </g>

  <!-- 三问验收 -->
  <text x="400" y="268" text-anchor="middle" fill="#1a1a1a" font-size="13" font-weight="600">三问验收（第 90 天）</text>
  <g fill="#ffffff" stroke="#c9c9c9" stroke-width="1.5">
    <rect x="140" y="280" width="150" height="34" rx="6"/>
    <rect x="325" y="280" width="150" height="34" rx="6"/>
    <rect x="510" y="280" width="150" height="34" rx="6"/>
  </g>
  <g fill="#1a1a1a" font-size="14" text-anchor="middle">
    <text x="215" y="303">环境可控</text>
    <text x="400" y="303">关系就位</text>
    <text x="585" y="303">基线建立</text>
  </g>

  <!-- 底部注记 -->
  <g text-anchor="middle" fill="#5a5a5a" font-size="13">
    <text x="400" y="354">三问有一问答不上，Onboarding 不算完成——闸门打勾不能替代三问〔标准〕</text>
    <text x="400" y="380">失败模式：只对接不交付、档案缺位、关键人单点</text>
  </g>
</svg>
