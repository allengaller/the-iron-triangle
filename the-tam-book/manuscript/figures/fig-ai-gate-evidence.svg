<!-- 图名：AI 上线闸门证据流——证据采集列汇入闸门评审菱形，分出上线与打回两个出口 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <rect width="800" height="500" fill="#ffffff"/>

  <!-- 左列标题 -->
  <text x="40" y="60" fill="#1a1a1a" font-size="17" font-weight="600">证据采集</text>

  <!-- 证据项（来源：第 32 章 32.3 上线闸门七项） -->
  <g fill="#ffffff" stroke="#c9c9c9" stroke-width="1.5">
    <rect x="40" y="80" width="190" height="44" rx="6"/>
    <rect x="40" y="134" width="190" height="44" rx="6"/>
    <rect x="40" y="188" width="190" height="44" rx="6"/>
    <rect x="40" y="242" width="190" height="44" rx="6"/>
    <rect x="40" y="296" width="190" height="44" rx="6"/>
    <rect x="40" y="350" width="190" height="44" rx="6"/>
  </g>
  <g fill="#1a1a1a" font-size="14" text-anchor="middle">
    <text x="135" y="108">评估基线</text>
    <text x="135" y="162">幻觉控制</text>
    <text x="135" y="216">人工接管</text>
    <text x="135" y="270">漂移监测</text>
    <text x="135" y="324">退出方案</text>
    <text x="135" y="378">外部模型／可解释</text>
  </g>

  <!-- 证据汇入闸门 -->
  <g stroke="#c9c9c9" stroke-width="1.5">
    <line x1="230" y1="102" x2="334" y2="230"/>
    <line x1="230" y1="156" x2="334" y2="230"/>
    <line x1="230" y1="210" x2="334" y2="230"/>
    <line x1="230" y1="264" x2="334" y2="230"/>
    <line x1="230" y1="318" x2="334" y2="230"/>
    <line x1="230" y1="372" x2="334" y2="230"/>
  </g>

  <!-- 闸门评审菱形 -->
  <polygon points="430,148 520,230 430,312 340,230"
           fill="#c8442c" fill-opacity="0.14" stroke="#c8442c" stroke-width="2"/>
  <g text-anchor="middle">
    <text x="430" y="224" fill="#1a1a1a" font-size="17" font-weight="600">AI 专项闸门</text>
    <text x="430" y="248" fill="#5a5a5a" font-size="13">七项证据齐备</text>
  </g>

  <!-- 两个出口 -->
  <g stroke="#c9c9c9" stroke-width="1.5">
    <line x1="524" y1="226" x2="614" y2="182"/>
    <line x1="524" y1="234" x2="614" y2="334"/>
  </g>
  <g fill="#c9c9c9">
    <polygon points="620,178 610,177 615,186"/>
    <polygon points="620,338 610,337 615,346"/>
  </g>

  <rect x="620" y="150" width="140" height="56" rx="6" fill="#c8442c" fill-opacity="0.14" stroke="#c8442c" stroke-width="1.5"/>
  <g text-anchor="middle">
    <text x="690" y="176" fill="#1a1a1a" font-size="17" font-weight="600">上线／扩量</text>
    <text x="690" y="196" fill="#5a5a5a" font-size="12">证据齐备后放行</text>
  </g>

  <rect x="620" y="310" width="140" height="56" rx="6" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.5"/>
  <g text-anchor="middle">
    <text x="690" y="336" fill="#1a1a1a" font-size="17" font-weight="600">打回</text>
    <text x="690" y="356" fill="#5a5a5a" font-size="12">补证据后重评</text>
  </g>

  <!-- 打回回到证据采集 -->
  <path d="M 690,366 L 690,448 L 135,448 L 135,400"
        fill="none" stroke="#c9c9c9" stroke-width="1.5" stroke-dasharray="5 4"/>
  <polygon points="135,396 130,406 140,406" fill="#c9c9c9"/>
  <text x="412" y="440" text-anchor="middle" fill="#8a8a8a" font-size="12">未闭环条件写入风险登记册，限期关闭后重评</text>

  <!-- 底部注记 -->
  <text x="400" y="482" text-anchor="middle" fill="#5a5a5a" font-size="13">缺少证据不予上线评审；未通过闸门的应用不得上线或扩量〔标准〕</text>
</svg>
