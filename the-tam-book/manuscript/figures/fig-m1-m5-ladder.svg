<!-- 图名：个人成熟度五级 M1–M5 阶梯——台阶面为级别名、立面为核心标志（第 36 章 36.2） -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 510" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <rect width="800" height="510" fill="#ffffff"/>

  <text x="40" y="42" fill="#1a1a1a" font-size="14" font-weight="600">个人成熟度五级：M1 → M5</text>

  <!-- 五级台阶 -->
  <g stroke="#c9c9c9" stroke-width="1.5" fill="#ffffff">
    <rect x="40" y="390" width="144" height="70"/>
    <rect x="184" y="320" width="144" height="140"/>
    <rect x="328" y="250" width="144" height="210"/>
    <rect x="472" y="180" width="144" height="280"/>
  </g>
  <rect x="616" y="110" width="144" height="350" fill="#c8442c" fill-opacity="0.14" stroke="#c8442c" stroke-width="1.5"/>

  <!-- 台阶面：级别名 -->
  <g fill="#1a1a1a" font-size="15" font-weight="600" text-anchor="middle">
    <text x="112" y="420">M1 执行者</text>
    <text x="256" y="350">M2 可靠接口人</text>
    <text x="400" y="280">M3 顾问</text>
    <text x="544" y="210">M4 战略伙伴</text>
    <text x="688" y="140">M5 行业影响力</text>
  </g>

  <!-- 立面：核心标志 -->
  <g fill="#5a5a5a" font-size="11" text-anchor="middle">
    <text x="112" y="442">判断需上级兜底</text>
    <text x="256" y="372">客户日常界面站得住</text>
    <text x="400" y="302">六维无明显短板</text>
    <text x="544" y="232">客户把你当自己人</text>
    <text x="688" y="162">能力可复制给他人</text>
  </g>

  <!-- 跃迁标志 -->
  <g fill="#8a8a8a" font-size="10" text-anchor="middle">
    <text x="184" y="312">做完 → 闭环</text>
    <text x="328" y="242">接住 → 变少</text>
    <text x="472" y="172">技术可信 → 政治可信</text>
    <text x="616" y="102">自己会 → 让别人会</text>
  </g>

  <line x1="30" y1="460" x2="770" y2="460" stroke="#c9c9c9" stroke-width="1.5"/>
  <text x="400" y="488" fill="#8a8a8a" font-size="12" text-anchor="middle">按证据判定，不按年头；可升也可降，M3 要求六维无明显短板。</text>
</svg>
