<!-- 图名：RACI 矩阵总览——八个典型场景 × 七个岗位的责任分配（第 2 章 2.4 节） -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <rect width="800" height="500" fill="#ffffff"/>

  <!-- 列头：七个岗位短名 -->
  <g fill="#1a1a1a" font-size="13" font-weight="600" text-anchor="middle">
    <text x="213.5" y="46">售前 SA</text>
    <text x="300.5" y="46">交付 PM</text>
    <text x="387.5" y="46">CSM</text>
    <text x="474.5" y="46">支持</text>
    <text x="561.5" y="46">客户 SRE</text>
    <text x="648.5" y="46">升级经理</text>
    <text x="735.5" y="46">TAM</text>
  </g>

  <!-- 行分隔线与列分隔线 -->
  <g stroke="#e3e3e3" stroke-width="1">
    <line x1="20" y1="102" x2="779" y2="102"/>
    <line x1="20" y1="148" x2="779" y2="148"/>
    <line x1="20" y1="194" x2="779" y2="194"/>
    <line x1="20" y1="240" x2="779" y2="240"/>
    <line x1="20" y1="286" x2="779" y2="286"/>
    <line x1="20" y1="332" x2="779" y2="332"/>
    <line x1="20" y1="378" x2="779" y2="378"/>
    <line x1="20" y1="424" x2="779" y2="424"/>
  </g>
  <g stroke="#c9c9c9" stroke-width="1">
    <line x1="20" y1="56" x2="779" y2="56"/>
    <line x1="170" y1="28" x2="170" y2="424"/>
  </g>

  <!-- 场景行标签 -->
  <g fill="#1a1a1a" font-size="13">
    <text x="24" y="84">方案技术评审</text>
    <text x="24" y="130">项目上线就绪</text>
    <text x="24" y="176">日常工单</text>
    <text x="24" y="222">故障 P1</text>
    <text x="24" y="268">事后复盘</text>
    <text x="24" y="314">采纳与用量</text>
    <text x="24" y="360">续约协同</text>
    <text x="24" y="406">架构演进</text>
  </g>

  <!-- A 类单元格：强调色实心 -->
  <g>
    <rect x="190.5" y="59" width="46" height="24" rx="6" fill="#c8442c"/>
    <text x="213.5" y="76" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle">A／R</text>
    <rect x="277.5" y="105" width="46" height="24" rx="6" fill="#c8442c"/>
    <text x="300.5" y="122" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle">A／R</text>
    <rect x="451.5" y="151" width="46" height="24" rx="6" fill="#c8442c"/>
    <text x="474.5" y="168" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle">A／R</text>
    <rect x="625.5" y="197" width="46" height="24" rx="6" fill="#c8442c"/>
    <text x="648.5" y="214" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle">A</text>
    <text x="648.5" y="235" fill="#8a8a8a" font-size="10" text-anchor="middle">流程</text>
    <rect x="712.5" y="243" width="46" height="24" rx="6" fill="#c8442c"/>
    <text x="735.5" y="260" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle">A／R</text>
    <rect x="364.5" y="289" width="46" height="24" rx="6" fill="#c8442c"/>
    <text x="387.5" y="306" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle">A／R</text>
    <rect x="712.5" y="335" width="46" height="24" rx="6" fill="#c8442c"/>
    <text x="735.5" y="352" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle">A／R</text>
    <rect x="712.5" y="381" width="46" height="24" rx="6" fill="#c8442c"/>
    <text x="735.5" y="398" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle">A／R</text>
  </g>

  <!-- R 类单元格：深灰实心 -->
  <g>
    <rect x="538.5" y="105" width="46" height="24" rx="6" fill="#5a5a5a"/>
    <text x="561.5" y="122" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle">R</text>
    <rect x="451.5" y="197" width="46" height="24" rx="6" fill="#5a5a5a"/>
    <text x="474.5" y="214" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle">R</text>
    <rect x="538.5" y="197" width="46" height="24" rx="6" fill="#5a5a5a"/>
    <text x="561.5" y="214" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle">R</text>
    <rect x="712.5" y="197" width="46" height="24" rx="6" fill="#5a5a5a"/>
    <text x="735.5" y="214" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle">R</text>
    <text x="735.5" y="235" fill="#8a8a8a" font-size="10" text-anchor="middle">客户信息流</text>
    <rect x="451.5" y="243" width="46" height="24" rx="6" fill="#5a5a5a"/>
    <text x="474.5" y="260" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle">R</text>
    <text x="474.5" y="281" fill="#8a8a8a" font-size="10" text-anchor="middle">厂商 RCA</text>
    <rect x="538.5" y="243" width="46" height="24" rx="6" fill="#5a5a5a"/>
    <text x="561.5" y="260" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle">R</text>
    <text x="561.5" y="281" fill="#8a8a8a" font-size="10" text-anchor="middle">客户 RCA</text>
  </g>

  <!-- C／I 类单元格：浅灰阶字母 -->
  <g fill="#5a5a5a" font-size="14" font-weight="600" text-anchor="middle">
    <text x="735.5" y="76">C</text>
    <text x="735.5" y="93" fill="#8a8a8a" font-size="10" font-weight="400">可运营性</text>
    <text x="213.5" y="122">C</text>
    <text x="474.5" y="122">C</text>
    <text x="735.5" y="122">C</text>
    <text x="735.5" y="139" fill="#8a8a8a" font-size="10" font-weight="400">客户侧意见</text>
    <text x="561.5" y="168">C</text>
    <text x="735.5" y="168">C／I</text>
    <text x="735.5" y="185" fill="#8a8a8a" font-size="10" font-weight="400">质量与影响</text>
    <text x="648.5" y="260">C</text>
    <text x="735.5" y="306">C</text>
    <text x="735.5" y="323" fill="#8a8a8a" font-size="10" font-weight="400">技术障碍</text>
    <text x="387.5" y="352">C</text>
    <text x="213.5" y="398">C</text>
    <text x="561.5" y="398">C</text>
  </g>

  <!-- 图例 -->
  <g font-size="13">
    <rect x="24" y="447" width="22" height="18" rx="6" fill="#c8442c"/>
    <text x="35" y="461" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">A</text>
    <text x="54" y="461" fill="#5a5a5a">对该场景交付物最终负责</text>
    <rect x="246" y="447" width="22" height="18" rx="6" fill="#5a5a5a"/>
    <text x="257" y="461" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">R</text>
    <text x="276" y="461" fill="#5a5a5a">执行并形成交付物</text>
    <text x="424" y="461" fill="#5a5a5a" font-weight="600">C</text>
    <text x="442" y="461" fill="#8a8a8a">咨询　</text>
    <text x="490" y="461" fill="#5a5a5a" font-weight="600">I</text>
    <text x="504" y="461" fill="#8a8a8a">知会</text>
    <text x="24" y="485" fill="#8a8a8a" font-size="12">空白＝本场景未分配固定角色；每个场景只有一个 A，C 不等于会签审批。</text>
  </g>
</svg>
