<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} · The TAM Book of AI Era</title>
<meta name="description" content="AI 时代技术客户经理（TAM）开源方法书——{{TITLE}}">
<script>
(function () {
  try {
    var t = localStorage.getItem('tam-theme');
    if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
    var f = localStorage.getItem('tam-fs');
    if (f) document.documentElement.style.setProperty('--fs', f);
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="{{ROOT}}assets/reader.css">
</head>
<body data-file="{{FILE}}">
<div id="progress"></div>

<header id="topbar">
  <button class="tbtn" id="btn-toc" aria-label="目录">
    <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
  </button>
  <a class="brand" href="{{ROOT}}index.html">
    <span class="seal">AI<br>TAM</span>
    <b>The TAM Book</b><small>AI 时代的 TAM 白皮书</small>
  </a>
  <div id="crumb">{{CRUMB}}</div>
  <div class="tb-btns">
    <button class="tbtn" id="btn-search" aria-label="搜索">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span class="hide-s">搜索 <kbd>/</kbd></span>
    </button>
    <button class="tbtn" id="btn-fs-down" aria-label="缩小字号">A−</button>
    <button class="tbtn" id="btn-fs-up" aria-label="放大字号">A+</button>
    <button class="tbtn" id="btn-theme" aria-label="切换深浅色">
      <svg viewBox="0 0 24 24" class="ic-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</header>

<div id="backdrop"></div>

<div id="shell">
  <nav id="sidebar" aria-label="目录">
    {{SIDEBAR}}
  </nav>

  <div id="main">
    <article>
      <div class="chead">
        <div class="kicker">{{KICKER}}{{GENRE}}</div>
        {{BIGNUM}}
        <h1>{{H1}}</h1>
        <div class="meta">{{META}}</div>
      </div>
{{CONTENT}}
      <nav class="pager">
        <a class="prev {{PREV_CLS}}" href="{{PREV_HREF}}"><span class="dir">← 上一篇</span><span class="pt">{{PREV_TITLE}}</span></a>
        <a class="next {{NEXT_CLS}}" href="{{NEXT_HREF}}"><span class="dir">下一篇 →</span><span class="pt">{{NEXT_TITLE}}</span></a>
      </nav>
    </article>
    <footer class="pagefoot">
      <span>The TAM Book of AI Era · v0.3 成稿 · CC BY-NC-SA 4.0</span>
      <span><a href="{{ROOT}}index.html">封面</a> · <a href="{{ROOT}}manuscript/00-reading-guide.html">导读</a> · <a href="{{ROOT}}manuscript/99-index.html">索引</a></span>
    </footer>
  </div>
</div>

<div id="search-overlay">
  <div id="search-panel">
    <input id="search-big" type="search" placeholder="搜索章节、条目与正文…" autocomplete="off">
    <div id="search-results"></div>
    <div id="search-hint"><span><kbd>↑</kbd><kbd>↓</kbd> 选择 · <kbd>Enter</kbd> 打开 · <kbd>Esc</kbd> 关闭</span><span id="search-count"></span></div>
  </div>
</div>

<script>window.__ROOT__ = "{{ROOT}}";</script>
<script src="{{ROOT}}assets/reader.js"></script>
</body>
</html>
